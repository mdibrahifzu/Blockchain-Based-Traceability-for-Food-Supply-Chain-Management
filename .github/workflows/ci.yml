name: CI with Snyk

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  snyk-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ Run Snyk test (vulnerabilities reported in logs but build won't fail)
      - name: Snyk Maven Test
        uses: snyk/actions/maven@master
        with:
          args: test --file=pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # 4️⃣ Run Snyk monitor to update the dashboard
      - name: Snyk Maven Monitor
        uses: snyk/actions/maven@master
        with:
          args: monitor --file=pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
