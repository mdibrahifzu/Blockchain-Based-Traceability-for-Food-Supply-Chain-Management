name: CI with Snyk

on:
  push:
    branches:
      - "**"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build with Maven
      - name: Build project
        run: mvn clean install

      # Install Snyk CLI
      - name: Install Snyk
        run: curl -sL https://snyk.io/install | bash

      # Run Snyk test (Open Source)
      - name: Run Snyk test
        run: snyk test --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # Send results to Snyk UI
      - name: Monitor in Snyk dashboard
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
