name: Snyk Maven Scan

# Trigger on any push or PR
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  snyk-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repo
      - name: Checkout code
        uses: actions/checkout@v5

      # 2️⃣ Set up Java (needed for Maven)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ Install Maven dependencies (so Snyk can read them)
      - name: Install Maven dependencies
        run: mvn dependency:resolve -B

      # 4️⃣ Set up Snyk CLI
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master
        with:
          version: 'latest'

      # 5️⃣ Run Snyk test on pom.xml
      - name: Run Snyk test
        run: snyk test --file=pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 6️⃣ Monitor in Snyk dashboard
      - name: Monitor in Snyk dashboard
        run: snyk monitor --file=pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
