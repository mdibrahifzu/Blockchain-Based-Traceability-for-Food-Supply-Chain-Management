name: CI with Snyk

# Trigger workflow on all pushes and pull requests to any branch
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Setup Java 8 (as your pom.xml uses Java 8 target)
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3️⃣ Build Maven project (skip Spotless formatting)
      - name: Build project (skip Spotless)
        run: mvn clean install -Dspotless.skip -B

      # 4️⃣ Install Snyk CLI
      - name: Install Snyk CLI
        run: curl -sL https://snyk.io/install | bash

      # 5️⃣ Run Snyk test (vulnerabilities reported but do not fail build)
      - name: Run Snyk test
        run: snyk test --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # 6️⃣ Send results to Snyk dashboard
      - name: Monitor in Snyk dashboard
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
