name: CI with Snyk

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  snyk-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Setup Java (required for Maven)
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3️⃣ Install Snyk CLI using official action
      - name: Install Snyk CLI
        uses: snyk/actions/setup@v3
        with:
          snyk-version: latest

      # 4️⃣ Run Snyk test (scan dependencies)
      - name: Run Snyk test
        run: snyk test --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # 5️⃣ Send results to Snyk dashboard
      - name: Monitor in Snyk dashboard
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
