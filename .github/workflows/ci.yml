name: CI with Snyk

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  snyk-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Setup Java (required for Snyk to analyze Maven)
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3️⃣ Install Snyk CLI
      - name: Install Snyk CLI
        run: curl -sL https://snyk.io/install | bash

      # 4️⃣ Run Snyk test (analyze project without building)
      - name: Run Snyk test
        run: snyk test --all-projects --severity-threshold=low
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # 5️⃣ Monitor in Snyk dashboard
      - name: Monitor in Snyk dashboard
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
